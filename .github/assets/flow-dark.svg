<text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="40" dy="0">Record</tspan></text>
<text x="40" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="40" dy="0">Capture a screen</tspan><tspan x="40" dy="19">in a browser</tspan><tspan x="40" dy="19">tab.</tspan></text>
<path d="M174 96.5 H188" stroke="#525252" stroke-width="1.5"/><path d="M184 92.5 L190 96.5 L184 100.5" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="196" y="24" width="144" height="145" rx="10" fill="#171717" stroke="#262626"/>
<text x="212" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#525252" opacity="1">02</text>
<text x="212" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="212" dy="0">Upload</tspan></text>
<text x="212" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="212" dy="0">Chunked,</tspan><tspan x="212" dy="19">resumable,</tspan><tspan x="212" dy="19">server-confirmed.</tspan></text>
<path d="M346 96.5 H360" stroke="#525252" stroke-width="1.5"/><path d="M356 92.5 L362 96.5 L356 100.5" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
