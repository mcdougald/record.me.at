<text x="384" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#525252" opacity="1">03</text>
<text x="384" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="384" dy="0">Share</tspan></text>
<text x="384" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="384" dy="0">One link,</tspan><tspan x="384" dy="19">checked on every</tspan><tspan x="384" dy="19">view.</tspan></text>
<path d="M518 96.5 H532" stroke="#525252" stroke-width="1.5"/><path d="M528 92.5 L534 96.5 L528 100.5" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
